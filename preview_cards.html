<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #08090b;
  margin: 0;
  padding: 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(14, 18, 26, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 8px 18px 8px 12px;
}
.logo-box-transparent {
  height: 48px;
  min-width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
}
.logo-img {
  height: 36px;
  max-width: 100px;
  object-fit: contain;
}
.info {
  display: flex;
  flex-direction: column;
}
.acronym {
  color: #fff;
  font-weight: 700;
  font-size: 14px;
}
.name {
  color: #8e95a5;
  font-size: 11px;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="row">
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/nasrda.png"></div>
    <div class="info"><span class="acronym">NASRDA</span><span class="name">National Space Agency</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/afsa.png"></div>
    <div class="info"><span class="acronym">AfSA</span><span class="name">African Space Agency</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/dsa.png"></div>
    <div class="info"><span class="acronym">DSA</span><span class="name">Defence Space Admin</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/pausn_white.png"></div>
    <div class="info"><span class="acronym">PAUSN</span><span class="name">Pan-African University</span></div>
  </div>
</div>
<div class="row">
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/sansa_white.svg"></div>
    <div class="info"><span class="acronym">SANSA</span><span class="name">South African Space Agency</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/nigcomsat.png"></div>
    <div class="info"><span class="acronym">NIGCOMSAT</span><span class="name">Communications Satellite Ltd</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/ksa.png"></div>
    <div class="info"><span class="acronym">KSA</span><span class="name">Kenya Space Agency</span></div>
  </div>
  <div class="card">
    <div class="logo-box-transparent"><img class="logo-img" src="/home/nikola/lune-aerospace-code/public/logos/egsa_white.png"></div>
    <div class="info"><span class="acronym">EgSA</span><span class="name">Egyptian Space Agency</span></div>
  </div>
</div>
</body>
</html>
